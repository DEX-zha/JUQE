[workspace]
members = ["crates/juqe-core", "crates/juqe-io", "crates/juqe-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/DEX-zha/JUQE"
publish = false

[workspace.dependencies]
juqe-core = { path = "crates/juqe-core" }
juqe-io = { path = "crates/juqe-io" }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
