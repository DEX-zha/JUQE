# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  poem: false
  auto_review:
    enabled: true
    drafts: true
  path_instructions:
    - path: "crates/juqe-core/**"
      instructions: >-
        Check cache ownership, stale and cross-cache completion handles, coalescing,
        loading/leased slot protection, overflow and bounded metadata validation.
        This crate must forbid unsafe code. The cache is metadata only; do not
        assume it owns buffers or enforces GPU fences. Follow CONTRIBUTING.md.
    - path: "crates/juqe-io/**"
      instructions: >-
        Audit every unsafe block for aliasing, initialization, ownership and bounds.
        Check O_DIRECT alignment, partial reads, EINTR, EOF, fallback accounting,
        concurrent positional reads and no successful publication on errors.
        Comments must use Rust doc conventions and SAFETY explanations.
    - path: "crates/juqe-runtime/**"
      instructions: >-
        Check bounded submissions, all-hit protection before misses, reservation
        rollback, completion draining after errors, worker shutdown, and storage
        lifetime. This crate must forbid unsafe code.
    - path: "crates/juqe-ffi/**"
      instructions: >-
        Audit raw pointer validity, disjoint pool ranges, uninitialized output
        handling, engine ownership, active batch leases, and panic containment.
        No worker may write a slot consumed by a GPU. Follow docs/ffi.md.
    - path: "adapters/llama/**"
      instructions: >-
        Check tensor shapes, checked allocation extents, failure cleanup, callback
        synchronization, and destruction order. Model pointers must be assigned
        only after setup succeeds. Preserve exact routing and report unsupported settings.
    - path: "docs/**"
      instructions: >-
        Require American English and the documentation conventions in CONTRIBUTING.md.
        Separate measured prototype results from Rust results and planned work.
        Reject claims that equal memory implies equal throughput, or that a
        synthetic transfer benchmark proves inference performance. The target
        is <=10 ms per expert including queue delay, not per generated token.
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "CONTRIBUTING.md"
      - "docs/architecture.md"
